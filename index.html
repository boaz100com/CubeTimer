<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TIMER</title>
        <link rel="stylesheet" href="timer.css">
        <link rel="icon" type="image/png" href="assets/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
        <link rel="shortcut icon" href="assets/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
        <link rel="manifest" href="assets/site.webmanifest" />
    </head>
    <body>
        <div id="timer">0.00</div>
        <div id="scramble"></div>
        <div id = "headline">Hold TO START</div>
        <div id = "Ao5">AO5: N/A</div>
        <div id = "Ao12">AO12: N/A</div> 
        <div id = "Ao50">AO50: N/A</div>
        <div id = "NumberS"></div>
        <div id = "Bsolve">PB: N/A</div>
        <div id = "Wsolve">PW: N/A</div>
        <div id = "display"></div>
        <button class="arrow" id="plus-two" onclick="Plus2()">+2s</button>
        <button class="arrow" id="delete" onclick="DeleteLast()">Delete</button>
        <button class="arrow" id="History1" onclick="History1()">History</button>
        <button class="arrow" id="HistoryChange" onclick="HistoryChange()">View</button>
        <button class="arrow" id="deletesolve" onclick="deletesolve()">Delete</button>
        <div class="dropdown">
            <button class= "arrow" id = "chooseCube" onclick="chooseCube()">Cube</button>
            <div class="dropdown-content" id="myDropdown">
                <li class="arrow1" id="choose2x2" onclick="choose2x2()">2x2</li>
                <li class="arrow1" id="choose3x3" onclick="choose3x3()">3x3</li>
                <li class="arrow1" id="choose4x4" onclick="choose4x4()">4x4</li>
                <li class="arrow1" id="choose5x5" onclick="choose5x5()">5x5</li>
                <li class="arrow1" id="choose6x6" onclick="choose6x6()">6x6</li>
                <li class="arrow1" id="choose7x7" onclick="choose7x7()">7x7</li>
                <li class="arrow1" id="choose8x8" onclick="chooseOH()">OH</li>
                <li class="arrow1" id="choosePyraminx" onclick="choosePyram()">Pyraminx</li>
                <li class="arrow1" id="chooseMegaminx" onclick="chooseMinx()">Megaminx</li>
                <li class="arrow1" id="chooseSkewb" onclick="chooseSkewb()">Skewb</li>
                <li class="arrow1" id="chooseSquare1" onclick="chooseSQ1()">Square-1</li>
                <li class="arrow1" id="chooseClock" onclick="chooseClock()">Clock</li>
                <li class="arrow1" id="chooseMastermorphix" onclick="chooseFTO()">FTO</li>
            </div> 
        </div>
        <script src="scrambow-browser.js"></script>
        <script src="timer.JS"></script> 
    </body>
</html>
